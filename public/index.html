<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Recommendations</title>
<style>
  :root {
    --paper: #f6f4ef; --ink: #1d1b19; --mute: #67625b; --rule: #d9d4ca; --link: #1f3a5f; --warn: #9b2c1d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #181715; --ink: #ebe7df; --mute: #9a948a; --rule: #34312c; --link: #9db8dd; --warn: #e08a7b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 700px; margin: 0 auto; padding: 32px 16px 72px; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 4px; }
  .lede { color: var(--mute); margin: 0 0 24px; }
  .ui { font-family: system-ui, "Segoe UI", sans-serif; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: .9rem; }
  select { font: inherit; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 2px; background: transparent; color: var(--ink); max-width: 100%; }
  label { color: var(--mute); }
  .member { margin: 16px 0 4px; }
  .member b { font-weight: 600; }
  .strategy { color: var(--mute); font-size: .9rem; margin: 0 0 8px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 2rem 1fr; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .n { color: var(--mute); font-variant-numeric: tabular-nums; }
  .name { font-size: 1.1rem; font-weight: 600; }
  .facts { color: var(--mute); font-size: .85rem; margin: 1px 0 6px; }
  .why { margin: 0; }
  .note { color: var(--mute); font-size: .88rem; margin: 6px 0 0; }
  details { margin-top: 6px; font-size: .8rem; color: var(--mute); }
  summary { cursor: pointer; }
  pre { margin: 6px 0 0; white-space: pre-wrap; font-size: .75rem; }
  .err { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Circle recommendations</h1>
  <p class="lede">Choose a member to see the Circles suggested for them and the reason for each.</p>

  <div class="controls ui">
    <span><label for="user">Member </label><select id="user"></select></span>
    <span><input type="checkbox" id="debug"> <label for="debug">Show scores</label></span>
  </div>

  <p class="member" id="who"></p>
  <p class="strategy ui" id="strategy"></p>
  <ol id="out" aria-live="polite"></ol>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SCENARIOS = { 42: "cold start", 7: "obvious matches", 15: "duplicate Circles", 23: "full and inactive Circles" };
const STRATEGY = {
  interests: "Based on the interests this member selected.",
  inferred: "No interests selected, so based on Circles they already belong to.",
  cold_start: "No interests and no Circles yet, so these are active, open Circles across a range of topics.",
};
let users = [];

async function init() {
  try {
    users = await (await fetch("/users")).json();
    $("user").innerHTML = users.map((u) =>
      `<option value="${u.id}">${u.id}. ${esc(u.name)}${SCENARIOS[u.id] ? " (" + SCENARIOS[u.id] + ")" : ""}</option>`).join("");
    let saved = null;
    try { saved = localStorage.getItem("uid"); } catch {}
    if (saved && users.some((u) => String(u.id) === saved)) $("user").value = saved;
    $("user").onchange = $("debug").onchange = load;
    load();
  } catch (e) { $("out").innerHTML = `<li class="err">Could not load members: ${esc(e.message)}</li>`; }
}

async function load() {
  const id = $("user").value;
  try { localStorage.setItem("uid", id); } catch {}
  const u = users.find((x) => String(x.id) === id);
  $("who").innerHTML = u ? `<b>${esc(u.name)}</b>. Interests: ${u.interests.length ? esc(u.interests.join(", ")) : "none selected"}.` : "";
  $("strategy").textContent = "";
  $("out").innerHTML = "";
  try {
    const res = await fetch(`/users/${id}/recommendations?limit=10${$("debug").checked ? "&debug=true" : ""}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || res.status);
    $("strategy").textContent = STRATEGY[data.strategy] ?? "";
    $("out").innerHTML = data.recommendations.map(item).join("");
  } catch (e) { $("out").innerHTML = `<li class="err">${esc(e.message)}</li>`; }
}

function item(r) {
  const c = r.circle;
  const size = c.max_members === null ? `${c.member_count} members` : `${c.member_count} of ${c.max_members} members`;
  const facts = [c.topic ? c.topic.replace(/-/g, " ") : "no topic", c.format.replace("_", " "), size, c.join_policy === "open" ? "open to join" : "join by request"];
  const sim = r.similar_circle_ids.length ? `<p class="note">Similar Circles you could also look at: ${r.similar_circle_ids.join(", ")}.</p>` : "";
  const dbg = r.debug ? `<details><summary>Score ${r.score}</summary><pre>${esc(JSON.stringify(r.debug, null, 2))}</pre></details>` : "";
  return `<li><span class="n ui">${r.rank}</span><div>
    <div class="name">${esc(c.name)}</div>
    <div class="facts ui">${esc(facts.join(" · "))}</div>
    <p class="why">${esc(r.explanation)}</p>${sim}${dbg}</div></li>`;
}
init();
</script>
</body>
</html>
